<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deploy a Snakemake workflow</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root">
      <p style="font-family: sans-serif; padding: 2rem">
        Loading the in-browser Python runtime (the first load takes a while)…
      </p>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      // Query parameters are passed as a mounted file instead of relying on
      // stlite's handling of the outer URL.
      const params = new URLSearchParams(window.location.search);
      const bootstrap = {
        repo: params.get("repo") || "",
        ref: params.get("ref") || "",
      };

      // The module list is generated by scripts/build-webapp.py; adding a file
      // under catalog_webapp/ does not require touching this page.
      const manifest = await (await fetch("./files.json")).json();
      const files = {};
      for (const path of manifest) {
        files[path] = { url: `./${path}` };
      }
      files["bootstrap.json"] = JSON.stringify(bootstrap);

      mount(
        {
          requirements: [],
          entrypoint: "app.py",
          files,
          streamlitConfig: {
            "client.toolbarMode": "viewer",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
